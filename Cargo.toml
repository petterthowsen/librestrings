[workspace]
resolver = "3"
members = ["crates/strings-dsp", "crates/strings-render", "crates/strings-plugin", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/petterthowsen/librestrings"
publish = false

[workspace.dependencies]
strings-dsp = { path = "crates/strings-dsp" }
# nih-plug isn't on crates.io; pinned to a commit (September 2026).
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

# The physics tests simulate seconds of audio; unoptimized builds make them crawl.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 1
